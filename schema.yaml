openapi: 3.0.3
info:
  title: PackRunner API Documentation
  version: 1.0.0
  description: ' API documentation for PackRunner project'
paths:
  /api/location/estimation/:
    get:
      operationId: api_location_estimation_retrieve
      parameters:
      - in: query
        name: destinations
        schema:
          type: string
        description: 'End point(s), format: "lat,lng" or multiple separated by "|".'
        required: true
      - in: query
        name: origins
        schema:
          type: string
        description: 'The starting point(s), format: "lat,lng" or multiple separated
          by "|".'
        required: true
      tags:
      - Location
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                duration:
                  text: 10 mins
                  value: 600
                distance:
                  text: 5.0 km
                  value: 5000
                status: OK
          description: Travel time and distance between origin and destination.
        '400':
          description: Bad request, missing or invalid query parameters.
        '500':
          description: Internal server error or Google Maps API error.
  /api/location/routes/:
    get:
      operationId: api_location_routes_retrieve
      parameters:
      - in: query
        name: destination
        schema:
          type: string
        description: 'End point, format: "lat,lng".'
        required: true
      - in: query
        name: origin
        schema:
          type: string
        description: 'The starting point, format: "lat,lng".'
        required: true
      tags:
      - Location
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                duration:
                  text: 10 mins
                  value: 600
                distance:
                  text: 5.0 km
                  value: 5000
                status: OK
          description: Travel time and distance between origin and destination.
        '400':
          description: Bad request, missing or invalid query parameters.
        '500':
          description: Internal server error or Google Maps API error.
  /api/login/:
    post:
      operationId: api_login_create
      summary: User login
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: OTP sent. Please verify to complete login.
        '400':
          description: Invalid credentials
        '500':
          description: Internal server error
  /api/logout/:
    post:
      operationId: api_logout_create
      summary: User logout
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Logout successful
        '500':
          description: Internal server error
  /api/orders/:
    post:
      operationId: api_orders_create
      summary: Create a new order
      tags:
      - Order
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Order'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Order'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '400':
          description: Validation failed
        '500':
          description: Internal server error
  /api/orders/{id}/:
    get:
      operationId: api_orders_retrieve
      summary: Get order detail by ID
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Order
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
        '404':
          description: Order not found
        '500':
          description: Internal server error
  /api/orders/{id}/status/:
    patch:
      operationId: api_orders_status_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Order
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrderStatusUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrderStatusUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrderStatusUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatusUpdate'
          description: ''
  /api/orders/list/:
    get:
      operationId: api_orders_list_list
      summary: Get all orders
      tags:
      - Order
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
          description: ''
        '500':
          description: Internal server error
  /api/orders/payment/:
    post:
      operationId: api_orders_payment_create
      tags:
      - Payment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Payment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Payment'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/orders/statistics/:
    get:
      operationId: api_orders_statistics_retrieve
      tags:
      - OrderStatistics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatistics'
          description: ''
  /api/register/:
    post:
      operationId: api_register_create
      summary: User registration
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
        '400':
          description: Validation failed
        '500':
          description: Internal server error
  /api/register/face/:
    get:
      operationId: api_register_face_retrieve
      tags:
      - RegisterFace
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceRegister'
          description: ''
    post:
      operationId: api_register_face_create
      summary: Register face
      tags:
      - RegisterFace
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FaceRegister'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FaceRegister'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          description: Face registered successfully
        '400':
          description: Validation failed
        '500':
          description: Internal server error
  /api/token/refresh/:
    post:
      operationId: api_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/user/address/:
    get:
      operationId: api_user_address_list
      summary: Get all user address
      tags:
      - Address
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
          description: ''
        '404':
          description: User not found
        '500':
          description: Internal server error
    post:
      operationId: api_user_address_create
      summary: Create user address
      tags:
      - Address
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Address'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Address'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
        '400':
          description: Validation failed
        '500':
          description: Internal server error
  /api/user/address/{id}/:
    patch:
      operationId: api_user_address_partial_update
      summary: Update user address
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Address
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAddress'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAddress'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAddress'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
        '400':
          description: Validation failed
        '404':
          description: Address not found
        '500':
          description: Internal server error
    delete:
      operationId: api_user_address_destroy
      summary: Delete user address
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Address
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Address deleted successfully
        '404':
          description: Address not found
        '500':
          description: Internal server error
  /api/users/{id}/:
    get:
      operationId: api_users_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - User
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/users/list/:
    get:
      operationId: api_users_list_retrieve
      tags:
      - User
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/users/profile/:
    get:
      operationId: api_users_profile_retrieve
      summary: Get user profile
      tags:
      - User
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '404':
          description: User not found
        '500':
          description: Internal server error
    put:
      operationId: api_users_profile_update
      summary: Update user profile
      tags:
      - User
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          description: Validation failed
        '500':
          description: Internal server error
  /api/verify-otp/:
    patch:
      operationId: api_verify_otp_partial_update
      summary: Verify OTP
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedVerifyOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedVerifyOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedVerifyOTPRequest'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOTPResponse'
          description: ''
        '400':
          description: Invalid OTP
        '500':
          description: Internal server error
components:
  schemas:
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        address_line:
          type: string
          readOnly: true
          nullable: true
        address:
          type: string
          nullable: true
          maxLength: 500
        ward:
          type: string
          nullable: true
          maxLength: 500
        district:
          type: string
          nullable: true
          maxLength: 500
        province:
          type: string
          nullable: true
          maxLength: 500
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
        is_default:
          type: boolean
      required:
      - address_line
      - id
      - user
    FaceRegister:
      type: object
      properties:
        face_file:
          type: string
          format: uri
      required:
      - face_file
    LoginRequest:
      type: object
      properties:
        phone_number:
          type: string
          maxLength: 15
        password:
          type: string
          maxLength: 128
      required:
      - password
      - phone_number
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          maxLength: 255
      required:
      - refresh
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        order_status:
          allOf:
          - $ref: '#/components/schemas/OrderStatusEnum'
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        shipments:
          type: array
          items:
            $ref: '#/components/schemas/Shipment'
      required:
      - created
      - id
      - order_status
      - payments
      - shipments
      - total_price
    OrderDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        order_status:
          $ref: '#/components/schemas/OrderStatusEnum'
        created:
          type: string
          format: date-time
          nullable: true
        shipments:
          type: array
          items:
            $ref: '#/components/schemas/Shipment'
          readOnly: true
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
          readOnly: true
      required:
      - id
      - order_status
      - payments
      - shipments
      - total_price
    OrderStatistics:
      type: object
      properties:
        total_orders:
          type: integer
        total_amount:
          type: number
          format: double
        ordered_orders:
          type: integer
        in_transit_orders:
          type: integer
        delivered_orders:
          type: integer
      required:
      - delivered_orders
      - in_transit_orders
      - ordered_orders
      - total_amount
      - total_orders
    OrderStatusEnum:
      enum:
      - Ordered
      - In Transit
      - Delivered
      type: string
      description: |-
        * `Ordered` - Ordered
        * `In Transit` - In Transit
        * `Delivered` - Delivered
    OrderStatusUpdate:
      type: object
      properties:
        order_status:
          $ref: '#/components/schemas/OrderStatusEnum'
      required:
      - order_status
    PatchedAddress:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        address_line:
          type: string
          readOnly: true
          nullable: true
        address:
          type: string
          nullable: true
          maxLength: 500
        ward:
          type: string
          nullable: true
          maxLength: 500
        district:
          type: string
          nullable: true
          maxLength: 500
        province:
          type: string
          nullable: true
          maxLength: 500
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
        is_default:
          type: boolean
    PatchedOrderStatusUpdate:
      type: object
      properties:
        order_status:
          $ref: '#/components/schemas/OrderStatusEnum'
    PatchedVerifyOTPRequest:
      type: object
      properties:
        phone_number:
          type: string
          maxLength: 15
        otp:
          type: string
          maxLength: 6
    Payment:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        payment_method:
          type: string
          maxLength: 50
        payment_status:
          type: string
          readOnly: true
        order:
          type: integer
          readOnly: true
      required:
      - amount
      - order
      - payment_method
      - payment_status
    RegisterRequest:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        phone_number:
          type: string
          maxLength: 15
        email:
          type: string
          format: email
          maxLength: 100
        password:
          type: string
          maxLength: 128
        date_of_birth:
          type: string
          format: date
        group:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 50
      required:
      - password
      - phone_number
    RegisterResponse:
      type: object
      properties:
        message:
          type: string
          default: User registered successfully!
        data:
          $ref: '#/components/schemas/User'
      required:
      - data
    Shipment:
      type: object
      properties:
        shipment_code:
          type: string
          readOnly: true
        shipment_type:
          $ref: '#/components/schemas/ShipmentTypeEnum'
        size:
          $ref: '#/components/schemas/SizeEnum'
        weight:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        note:
          type: string
          nullable: true
          maxLength: 200
        receiver_name:
          type: string
          maxLength: 100
        receiver_phone_number:
          type: string
          nullable: true
          maxLength: 15
        receiver_address:
          type: string
          maxLength: 100
        receiver_province:
          type: string
          maxLength: 100
        receiver_district:
          type: string
          maxLength: 100
        receiver_ward:
          type: string
          maxLength: 100
        receiver_longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
        receiver_latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
        sender_name:
          type: string
          maxLength: 100
        sender_address:
          type: string
          maxLength: 100
        sender_province:
          type: string
          maxLength: 100
        sender_district:
          type: string
          maxLength: 100
        sender_ward:
          type: string
          maxLength: 100
        sender_longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
        sender_latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
      required:
      - receiver_address
      - receiver_district
      - receiver_name
      - receiver_province
      - receiver_ward
      - sender_address
      - sender_district
      - sender_name
      - sender_province
      - sender_ward
      - shipment_code
      - shipment_type
      - size
      - weight
    ShipmentTypeEnum:
      enum:
      - Food
      - Cloth
      - Electronic
      type: string
      description: |-
        * `Food` - Food
        * `Cloth` - Cloth
        * `Electronic` - Electronic
    SizeEnum:
      enum:
      - Small
      - Medium
      - Large
      - X-large
      type: string
      description: |-
        * `Small` - S
        * `Medium` - M
        * `Large` - L
        * `X-large` - Xl
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
          maxLength: 255
        phone_number:
          type: string
          maxLength: 20
        is_active:
          type: boolean
        is_banned:
          type: boolean
        date_of_birth:
          type: string
          format: date
          nullable: true
        otp_require:
          type: boolean
      required:
      - email
      - id
      - name
      - password
      - phone_number
    UserProfileRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        phone_number:
          type: string
          maxLength: 15
        date_of_birth:
          type: string
          format: date
    VerifyOTPData:
      type: object
      properties:
        refresh:
          type: string
        access:
          type: string
        groups:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
      required:
      - access
      - groups
      - permissions
      - refresh
    VerifyOTPResponse:
      type: object
      properties:
        message:
          type: string
          default: OTP verified successfully
        data:
          $ref: '#/components/schemas/VerifyOTPData'
      required:
      - data
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
