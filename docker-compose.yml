services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: packrunner-web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/packrunner-api
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=PackRunner.settings
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: packrunner-db
    environment:
      POSTGRES_DB: packrunner-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
